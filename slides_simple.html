<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrawCall 最適化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1a1a1a;
        }

        .slides-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            scroll-behavior: smooth;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
        }

        /* スライド 1: Before */
        .slide-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .slide-1 h1 {
            font-size: 80px;
            margin-bottom: 60px;
            font-weight: bold;
        }

        .slide-1 .big-number {
            font-size: 120px;
            font-weight: bold;
            color: #ffff00;
            margin: 40px 0;
        }

        .slide-1 .label {
            font-size: 36px;
            margin-bottom: 60px;
            opacity: 0.9;
        }

        .slide-1 .fps {
            font-size: 64px;
            margin-top: 60px;
            color: #ff6b6b;
        }

        .slide-1 .arrow {
            font-size: 48px;
            margin: 40px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }

        /* スライド 2: After */
        .slide-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .slide-2 h1 {
            font-size: 80px;
            margin-bottom: 60px;
            font-weight: bold;
        }

        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            margin: 60px 0;
            max-width: 1200px;
        }

        .comparison-item {
            padding: 40px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
        }

        .comparison-item h3 {
            font-size: 32px;
            margin-bottom: 40px;
        }

        .comparison-item .big {
            font-size: 80px;
            font-weight: bold;
            margin: 30px 0;
        }

        .comparison-item .before {
            color: #ff6b6b;
        }

        .comparison-item .after {
            color: #51cf66;
        }

        .comparison-item .label-small {
            font-size: 20px;
            opacity: 0.8;
            margin-top: 20px;
        }

        .nav-container {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: #333;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .slide-counter {
            position: fixed;
            top: 40px;
            right: 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="slides-container" id="slidesContainer">
        <!-- スライド 1: Before -->
        <div class="slide slide-1">
            <h1>❌ Before</h1>
            <div class="label">DrawCall 数</div>
            <div class="big-number">2000+</div>
            <div class="arrow">↓</div>
            <div class="fps">FPS: 20</div>
        </div>

        <!-- スライド 2: After -->
        <div class="slide slide-2">
            <h1>✅ After</h1>
            <div class="comparison">
                <div class="comparison-item">
                    <h3>DrawCall</h3>
                    <div class="big before">2000+</div>
                    <div class="big after">1</div>
                    <div class="label-small">Pipeline 設定</div>
                </div>
                <div class="comparison-item">
                    <h3>FPS</h3>
                    <div class="big before">20</div>
                    <div class="big after">40+</div>
                    <div class="label-small">2倍以上高速化</div>
                </div>
            </div>
        </div>
    </div>

    <div class="slide-counter"><span id="currentSlide">1</span> / 2</div>
    <div class="nav-container">
        <button onclick="prevSlide()">← 前</button>
        <button onclick="nextSlide()">次 →</button>
    </div>

    <script>
        const container = document.getElementById('slidesContainer');
        const counter = document.getElementById('currentSlide');
        let currentSlide = 0;
        const totalSlides = 2;

        function updateSlide() {
            const slideWidth = window.innerWidth;
            container.scrollLeft = currentSlide * slideWidth;
            counter.textContent = currentSlide + 1;
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });
    </script>
</body>
</html>
